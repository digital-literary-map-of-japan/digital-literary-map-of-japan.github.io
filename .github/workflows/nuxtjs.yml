name: Build and Deploy to Production

on:
  push:
    branches: ["main"]
  # Allows external webhook trigger
  repository_dispatch:
    types:
      - webhook

permissions:
  contents: read

concurrency:
  group: "build-and-deploy"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Axios and Run init.js
        run: npm i axios && node node/init.js

      - name: Install dependencies
        run: npm i

      - name: Static HTML export with Nuxt
        run: npm run generate
        env:
          NODE_OPTIONS: --max-old-space-size=16384

      - name: Zip the distribution folder
        run: zip -r dist.zip dist

      - name: Copy to Remote Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_KEY }}
          passphrase: ${{ secrets.REMOTE_PASSPHRASE }}
          port: ${{ secrets.REMOTE_PORT }}
          source: "dist.zip"
          target: "/home/${{ secrets.REMOTE_USER }}/"

      - name: SSH Command Execution
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_KEY }}
          passphrase: ${{ secrets.REMOTE_PASSPHRASE }}
          port: ${{ secrets.REMOTE_PORT }}
          script: |
            rm -rf dist && unzip dist.zip && rsync -avv --log-file=./log.txt --delete /home/literarymaps/dist/ /home/literarymaps/www/dlm/ && rm -rf dist && rm dist.zip
